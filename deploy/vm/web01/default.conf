# web01: HAProxy -> this nginx -> apps. Previous stock config: default.conf.bak
# Root (/) is MTG Archive (/opt/docker/mtgarchive). A static site added later
# needs its own `location /<site>/ { root /usr/share/nginx/html; }` block,
# since / no longer serves ./html.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Cloudflare sits in front of HAProxy, so the last X-Forwarded-For entry is a
# Cloudflare edge, not the visitor. Hand the app the visitor's IP (the app
# trusts one proxy hop and reads the last entry); fall back to HAProxy's
# header for any request that did not come through Cloudflare.
map $http_cf_connecting_ip $client_xff {
    ''      $http_x_forwarded_for;
    default $http_cf_connecting_ip;
}

server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    # Docker's embedded DNS. The upstream is resolved per request (via the
    # variable below) so web01 still starts, and serves the 50x page, while
    # the mtgarchive container is down or being recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Redirects stay relative: nginx only sees plain HTTP behind HAProxy.
    absolute_redirect off;

    # The app accepts JSON bodies up to 20 MB (collection/deck saves).
    client_max_body_size 25m;

    location / {
        set $mtgarchive http://mtgarchive:80;
        proxy_pass $mtgarchive;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        # Don't append this hop, and pass HAProxy's Proto=https through: sending
        # $scheme (http here) would make the app refuse to set its secure session
        # cookie, and an appended hop would give every user the same IP.
        proxy_set_header X-Forwarded-For $client_xff;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # socket.io (live trading) holds connections open; HAProxy's own idle limit is 1h.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Ops dashboard (admin-only, enforced by the ops service itself).
    location = /ops { return 301 /ops/; }
    location /ops/ {
        set $mtgops http://mtgarchive-ops:80;
        proxy_pass $mtgops;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $client_xff;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
