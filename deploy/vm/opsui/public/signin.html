<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin sign-in required</title>
<style>
  :root { --bg:#f9f9f7; --card:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --line:rgba(11,11,11,.10); --accent:#2a78d6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d0d0d; --card:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --line:rgba(255,255,255,.10); --accent:#3987e5; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
         font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; padding:16px; box-sizing:border-box; }
  .card { max-width:380px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:24px; }
  h1 { font-size:17px; margin:0 0 8px; }
  p { margin:0 0 16px; color:var(--ink2); }
  a { display:inline-block; background:var(--accent); color:#fff; text-decoration:none; padding:8px 14px; border-radius:8px; font-weight:600; }
</style>
</head>
<body>
  <div class="card">
    <h1>Admin sign-in required</h1>
    <p>Sign in to MTG Archive with an admin account, then come back to this page.</p>
    <a href="/">Go to MTG Archive</a>
  </div>
</body>
</html>
