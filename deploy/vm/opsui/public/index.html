<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>VM Ops</title>
<style>
  :root {
    color-scheme: light;
    --page:#f9f9f7; --surface:#fcfcfb; --raised:#ffffff;
    --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --axis:#c3c2b7; --line:rgba(11,11,11,.10);
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
    --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
    --good-ink:#006300; --link:#256abf; --wash:rgba(11,11,11,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page:#0d0d0d; --surface:#1a1a19; --raised:#222220;
      --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
      --grid:#2c2c2a; --axis:#383835; --line:rgba(255,255,255,.10);
      --s1:#3987e5; --s2:#d95926; --s3:#199e70;
      --good-ink:#0ca30c; --link:#6da7ec; --wash:rgba(255,255,255,.05);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --raised:#222220;
    --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --line:rgba(255,255,255,.10);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --good-ink:#0ca30c; --link:#6da7ec; --wash:rgba(255,255,255,.05);
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--page); color:var(--ink); font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
  a { color:var(--link); text-decoration:none; } a:hover { text-decoration:underline; }
  code, .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12.5px; }
  .wrap { max-width:1200px; margin:0 auto; padding:20px 16px 48px; }
  header { display:flex; flex-wrap:wrap; align-items:center; gap:12px 20px; margin-bottom:16px; }
  header h1 { font-size:18px; margin:0; font-weight:650; display:flex; align-items:center; gap:8px; }
  header .sub { color:var(--ink2); }
  .spacer { flex:1; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--surface); }
  .seg button { border:0; background:none; color:var(--ink2); padding:6px 12px; font:inherit; cursor:pointer; }
  .seg button[aria-pressed="true"] { background:var(--wash); color:var(--ink); font-weight:600; }
  .btn { border:1px solid var(--line); background:var(--surface); color:var(--ink); padding:6px 12px; border-radius:8px; font:inherit; cursor:pointer; }
  .btn:hover { background:var(--wash); }
  .stale { opacity:.55; transition:opacity .2s; }
  nav.tabs { display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:20px; overflow-x:auto; }
  nav.tabs button { border:0; background:none; color:var(--ink2); padding:10px 12px; font:inherit; cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; }
  nav.tabs button[aria-selected="true"] { color:var(--ink); border-bottom-color:var(--ink); font-weight:600; }
  section[hidden] { display:none; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:28px 0 10px; font-weight:600; }
  h2:first-child { margin-top:0; }
  .grid { display:grid; gap:12px; }
  .tiles { grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); }
  .cards { grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); }
  .charts { grid-template-columns:repeat(auto-fit, minmax(340px, 1fr)); }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px; min-width:0; }
  .tile .label { color:var(--ink2); font-size:13px; }
  .tile .value { font-size:24px; font-weight:600; margin-top:2px; }
  .tile .note { color:var(--muted); font-size:12.5px; margin-top:2px; }
  .pill { display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:600; padding:2px 8px 2px 6px; border-radius:999px; background:var(--wash); color:var(--ink); white-space:nowrap; }
  .pill svg { width:14px; height:14px; flex:none; }
  .ok svg { color:var(--good); } .warn svg { color:var(--warn); } .bad svg { color:var(--crit); } .info svg { color:var(--muted); }
  .svc-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px; }
  .svc-head .name { font-weight:600; display:flex; gap:8px; align-items:center; min-width:0; }
  .svc-head .name span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .svc-head .name svg { width:16px; height:16px; color:var(--muted); flex:none; }
  dl.kv { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; margin:0; font-size:13px; }
  dl.kv dt { color:var(--ink2); } dl.kv dd { margin:0; text-align:right; font-variant-numeric:tabular-nums; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chart-head { display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:6px; }
  .chart-head .title { font-weight:600; }
  .chart-head .now { color:var(--ink2); font-size:13px; font-variant-numeric:tabular-nums; }
  .legend { display:flex; flex-wrap:wrap; gap:4px 14px; font-size:12.5px; color:var(--ink2); margin-bottom:4px; min-height:18px; }
  .legend i { display:inline-block; width:14px; height:2px; border-radius:1px; vertical-align:middle; margin-right:6px; }
  .chart { position:relative; height:170px; touch-action:pan-y; }
  .chart svg { width:100%; height:100%; display:block; overflow:visible; }
  .chart .empty { position:absolute; inset:0; display:grid; place-items:center; color:var(--muted); font-size:13px; }
  .tip { position:absolute; pointer-events:none; background:var(--raised); border:1px solid var(--line); border-radius:8px; padding:6px 9px; font-size:12.5px;
         box-shadow:0 4px 14px rgba(0,0,0,.12); white-space:nowrap; z-index:2; display:none; }
  .tip .when { color:var(--muted); margin-bottom:3px; }
  .tip .row { display:flex; align-items:center; gap:6px; }
  .tip .row i { width:10px; height:2px; border-radius:1px; }
  .tip .row b { font-variant-numeric:tabular-nums; }
  .tip .row span { color:var(--ink2); }
  .linkbtn { border:0; background:none; color:var(--link); font:inherit; font-size:12.5px; cursor:pointer; padding:0; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; color:var(--ink2); font-weight:500; padding:6px 8px; border-bottom:1px solid var(--line); }
  td { padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  tr:last-child td { border-bottom:0; }
  .tablewrap { overflow-x:auto; }
  .datatable { margin-top:8px; max-height:220px; overflow:auto; }
  .event { display:grid; grid-template-columns:22px 1fr auto; gap:4px 10px; padding:10px 0; border-bottom:1px solid var(--line); }
  .event:last-child { border-bottom:0; }
  .event svg { width:16px; height:16px; margin-top:2px; }
  .event .what { font-weight:600; }
  .event .detail { color:var(--ink2); font-size:13px; grid-column:2 / 4; overflow-wrap:anywhere; }
  .event .when { color:var(--muted); font-size:12.5px; white-space:nowrap; }
  .segbar { display:flex; gap:2px; height:28px; margin:8px 0 10px; }
  .segbar div { border-radius:4px; min-width:2px; color:#fff; font-size:12px; font-weight:600; display:flex; align-items:center; padding-left:6px; overflow:hidden; white-space:nowrap; }
  .segbar .free { background:var(--grid); color:var(--ink2); }
  .keys { display:flex; flex-wrap:wrap; gap:4px 14px; font-size:12.5px; color:var(--ink2); }
  .keys i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
  .callout { display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border-radius:10px; background:var(--wash); border:1px solid var(--line); font-size:13px; }
  .callout svg { width:16px; height:16px; flex:none; margin-top:1px; }
  .logbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:10px; }
  .logbar select, .logbar input { font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:6px 8px; }
  .logbar input[type=search] { flex:1; min-width:160px; }
  .logbar label { color:var(--ink2); display:flex; align-items:center; gap:6px; }
  pre.logs { margin:0; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px; height:60vh; overflow:auto; font-size:12px; line-height:1.5; }
  pre.logs .ts { color:var(--muted); } pre.logs .err { color:var(--crit); }
  .err-banner { margin-bottom:12px; }
  @media (max-width:520px) { .charts { grid-template-columns:1fr; } .tile .value { font-size:21px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></svg>
      host01 <span class="sub">· MTG Archive</span>
    </h1>
    <span id="overall"></span>
    <span class="spacer"></span>
    <span class="sub" id="updated"></span>
    <div class="seg" role="group" aria-label="Time range" id="range">
      <button data-r="1h" aria-pressed="true">1 hour</button>
      <button data-r="6h" aria-pressed="false">6 hours</button>
      <button data-r="24h" aria-pressed="false">24 hours</button>
    </div>
  </header>
  <div id="error" class="err-banner" hidden></div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="overview" aria-selected="true">Overview</button>
    <button role="tab" data-tab="metrics" aria-selected="false">Metrics</button>
    <button role="tab" data-tab="deployments" aria-selected="false">Deployments</button>
    <button role="tab" data-tab="storage" aria-selected="false">Storage &amp; backups</button>
    <button role="tab" data-tab="logs" aria-selected="false">Logs</button>
  </nav>

  <main id="main">
    <section data-panel="overview">
      <div class="grid tiles" id="tiles"></div>
      <h2>Services</h2>
      <div class="grid cards" id="services"></div>
      <h2>Live version</h2>
      <div class="card" id="liveCard"></div>
    </section>

    <section data-panel="metrics" hidden>
      <div class="grid charts" id="charts"></div>
    </section>

    <section data-panel="deployments" hidden>
      <div class="grid cards" id="deployCards"></div>
      <h2>History</h2>
      <div class="card" id="events"></div>
    </section>

    <section data-panel="storage" hidden>
      <h2>Disk</h2>
      <div class="card" id="disk"></div>
      <h2>Backups</h2>
      <div id="backupNote"></div>
      <div class="card tablewrap" id="backups" style="margin-top:12px"></div>
      <h2>Database tables</h2>
      <div class="card tablewrap" id="tables"></div>
      <h2>Docker images</h2>
      <div class="card tablewrap" id="images"></div>
    </section>

    <section data-panel="logs" hidden>
      <div class="logbar">
        <select id="logCtr" aria-label="Container">
          <option value="mtgarchive">App (mtgarchive)</option>
          <option value="mtgarchive-db">Database (mtgarchive-db)</option>
          <option value="web01">Proxy (web01)</option>
        </select>
        <select id="logTail" aria-label="Lines">
          <option value="300">Last 300 lines</option>
          <option value="1000">Last 1,000 lines</option>
          <option value="2000">Last 2,000 lines</option>
        </select>
        <input type="search" id="logFilter" placeholder="Filter lines" aria-label="Filter lines">
        <label><input type="checkbox" id="logErrors"> Errors only</label>
        <label><input type="checkbox" id="logFollow" checked> Auto-refresh</label>
        <button class="btn" id="logRefresh">Refresh</button>
      </div>
      <pre class="logs mono" id="logs" aria-live="off"></pre>
    </section>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
